<!DOCTYPE html>
<html>
<head>
  <title>Messenger Capture</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="container">
    <div id="loginView" class="card login-card">
      <h1>Login</h1>

      <input id="emailInput" type="email" placeholder="Email">
      <input id="passwordInput" type="password" placeholder="Password">

      <button id="loginBtn">Login</button>
      <p id="loginStatus" class="status-text"></p>
    </div>

    <div id="appView" style="display: none;">
      <header class="topbar">
        <div>
          <h1>Task Capture</h1>
          <p class="subtitle">Messenger operations tracker</p>
        </div>

        <button id="logoutBtn" class="secondary-btn">Logout</button>
      </header>

      <section class="card input-card">
        <textarea id="taskInput" placeholder="Paste or write a task"></textarea>
        <button id="saveBtn">Save Task</button>
        <p id="status" class="status-text"></p>
      </section>

      <section class="board">
        <div class="board-header">
          <h2>Saved Tasks</h2>
        </div>

        <ul id="taskList" class="task-list"></ul>
      </section>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
