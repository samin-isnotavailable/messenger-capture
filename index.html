<!DOCTYPE html>
<html lang="en" class="antialiased bg-[#09090b] text-zinc-200 selection:bg-indigo-500/30">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Capture</title>
  <link rel="stylesheet" href="/src/styles.css">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Modern SaaS Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>

<body class="h-screen w-screen overflow-hidden flex flex-col cursor-default bg-[#09090b] text-zinc-200">

  <!-- LOGIN VIEW -->
  <div id="loginView" class="m-auto w-full max-w-sm px-6">
    <div class="bg-[#121214] border border-white/10 p-8 rounded-2xl shadow-xl">
      <div class="flex justify-center mb-6">
        <div class="p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-xl text-indigo-400">
          <i class="ph-fill ph-target text-4xl"></i>
        </div>
      </div>
      <h1 class="text-xl font-semibold text-center mb-6 text-zinc-100 tracking-tight">Login to Tracker</h1>

      <div class="space-y-4 text-sm">
        <input id="emailInput" type="email" placeholder="Email address"
          class="w-full bg-[#09090b] border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 transition-all placeholder:text-zinc-600">
        <input id="passwordInput" type="password" placeholder="Password"
          class="w-full bg-[#09090b] border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 transition-all placeholder:text-zinc-600">

        <button id="loginBtn"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl px-4 py-3 mt-2 transition-all active:scale-[0.98] shadow-md shadow-indigo-500/10">
          Sign In
        </button>
        <p id="loginStatus" class="text-center text-xs font-medium text-zinc-500 mt-4 h-4"></p>
      </div>
    </div>
  </div>

  <!-- APP VIEW -->
  <div id="appView" class="hidden w-full max-w-3xl mx-auto h-screen flex flex-col pt-8 px-6">

    <!-- Header -->
    <header id="appHeader"
      class="flex justify-between items-center mb-6 cursor-grab active:cursor-grabbing select-none shrink-0">
      <div class="flex items-center gap-3 pointer-events-none">
        <div class="p-2 bg-indigo-500/10 border border-indigo-500/20 rounded-lg text-indigo-400">
          <i class="ph-fill ph-target text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-semibold text-zinc-100 tracking-tight">Task Capture</h1>
          <p class="text-xs text-zinc-500 font-medium">Messenger Operations</p>
        </div>
      </div>
      <button id="logoutBtn"
        class="text-sm font-medium text-zinc-400 hover:text-zinc-200 transition-colors flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-white/5 cursor-pointer">
        <i class="ph-bold ph-sign-out"></i> Logout
      </button>
    </header>

    <!-- Modern Input Card -->
    <section
      class="bg-[#121214] border border-white/10 rounded-2xl p-4 mb-8 shadow-lg shrink-0 focus-within:border-indigo-500/50 transition-colors duration-200">
      <textarea id="taskInput" placeholder="Paste or write a task..."
        class="w-full bg-transparent border-none text-[15px] text-zinc-100 placeholder:text-zinc-600 resize-none outline-none min-h-[60px] p-2 leading-relaxed"></textarea>

      <!-- Toolbar -->
      <div class="flex flex-wrap items-center justify-between mt-2 pt-3 border-t border-white/5 gap-y-3">

        <!-- Left: Selectors -->
        <div class="flex flex-wrap gap-2">
          <select id="prioritySelect"
            class="bg-white/5 border border-white/10 rounded-lg text-xs font-medium text-zinc-300 px-3 py-2 outline-none focus:border-indigo-500 hover:bg-white/10 transition-colors cursor-pointer appearance-none [color-scheme:dark]">
            <option value="low" class="bg-[#121214]">Low Priority</option>
            <option value="medium" class="bg-[#121214]" selected>Medium Priority</option>
            <option value="high" class="bg-[#121214]">High Priority</option>
          </select>

          <input type="date" id="dueDateInput"
            class="bg-white/5 border border-white/10 rounded-lg text-xs font-medium text-zinc-300 px-3 py-2 outline-none focus:border-indigo-500 hover:bg-white/10 transition-colors cursor-pointer [color-scheme:dark]">

          <!-- Hide Completed Toggle -->
          <button id="toggleCompletedBtn"
            class="bg-white/5 border border-white/10 rounded-lg text-xs font-medium text-zinc-300 px-3 py-2 outline-none hover:bg-white/10 transition-colors cursor-pointer flex items-center gap-1.5">
            <i class="ph-bold ph-eye-slash text-[14px]"></i>
            <span>Hide Done</span>
          </button>
        </div>

        <!-- Right: Status & Action (FIXED ALIGNMENT) -->
        <div class="flex items-center gap-4 pl-2 ml-auto shrink-0">
          <span id="status" class="text-[11px] font-medium text-zinc-500"></span>
          <button id="saveBtn"
            class="bg-zinc-100 hover:bg-white text-zinc-900 px-5 py-2 rounded-xl text-sm font-semibold transition-all active:scale-95 flex items-center gap-2 shadow-sm">
            <i class="ph-bold ph-paper-plane-tilt"></i> Save
          </button>
        </div>
      </div>
    </section>

    <!-- Task List Container -->
    <section class="flex-1 overflow-hidden flex flex-col min-h-0">
      <ul id="taskList" class="flex-1 overflow-y-auto space-y-3 pb-10 custom-scrollbar pr-2"></ul>
    </section>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
