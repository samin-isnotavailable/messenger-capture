<!DOCTYPE html>
<html lang="en" class="antialiased bg-[#09090b] text-zinc-200 selection:bg-indigo-500/30">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Capture</title>
  <link rel="stylesheet" href="/src/styles.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>

<body class="h-screen w-screen overflow-hidden flex flex-col cursor-default bg-[#09090b] text-zinc-200">

  <div id="loginView" class="m-auto w-full max-w-sm px-6">
    <div class="bg-[#121214] border border-white/10 p-8 rounded-2xl shadow-xl">
      <div class="flex justify-center mb-6">
        <div class="p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-xl text-indigo-400">
          <i class="ph-fill ph-target text-4xl"></i>
        </div>
      </div>
      <h1 class="text-xl font-semibold text-center mb-6 text-zinc-100 tracking-tight">Login to Tracker</h1>

      <div class="space-y-4 text-sm">
        <input id="emailInput" type="email" placeholder="Email address"
          class="w-full bg-[#09090b] border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 transition-all placeholder:text-zinc-600">
        <input id="passwordInput" type="password" placeholder="Password"
          class="w-full bg-[#09090b] border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 transition-all placeholder:text-zinc-600">

        <button id="loginBtn"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl px-4 py-3 mt-2 transition-all active:scale-[0.98] shadow-md shadow-indigo-500/10">
          Sign In
        </button>
        <p id="loginStatus" class="text-center text-xs font-medium text-zinc-500 mt-4 h-4"></p>
      </div>
    </div>
  </div>

  <div id="appView" class="hidden w-full max-w-5xl mx-auto h-screen flex flex-col pt-8 px-8">

    <header id="appHeader"
      class="flex justify-between items-center mb-8 cursor-grab active:cursor-grabbing select-none shrink-0 border-b border-white/5 pb-4">
      <div class="flex items-center gap-4 pointer-events-none">
        <div
          class="p-2.5 bg-gradient-to-br from-violet-500/20 to-fuchsia-500/20 border border-violet-500/30 rounded-xl text-violet-400 shadow-[0_0_15px_rgba(139,92,246,0.15)]">
          <i class="ph-fill ph-target text-xl animate-pulse"></i>
        </div>
        <div>
          <h1
            class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-zinc-100 to-zinc-400 tracking-tight">
            Task Capture</h1>
          <p class="text-xs text-zinc-500 font-medium uppercase tracking-wider mt-0.5">Messenger Operations</p>
        </div>
      </div>
      <button id="logoutBtn"
        class="text-sm font-medium text-zinc-400 hover:text-rose-400 transition-colors flex items-center gap-2 px-4 py-2 rounded-xl hover:bg-rose-500/10 cursor-pointer">
        <i class="ph-bold ph-sign-out"></i> Logout
      </button>
    </header>

    <section
      class="composer-focus-ring bg-[#0e0e11] border border-white/10 rounded-xl mb-6 shadow-md shrink-0 transition-all duration-200 overflow-hidden relative">

      <textarea id="taskInput" placeholder="Capture a task..."
        class="w-full bg-transparent border-none text-[14px] text-zinc-200 placeholder:text-zinc-600 resize-none outline-none min-h-[70px] p-4 pb-2 leading-relaxed no-scrollbar"></textarea>

      <div class="flex items-center justify-between px-3 py-2 bg-[#121214]/50 border-t border-white/5">

        <div class="flex items-center gap-2">
          <select id="prioritySelect"
            class="bg-transparent text-xs font-medium text-zinc-400 hover:text-zinc-200 px-2 py-1.5 outline-none cursor-pointer appearance-none transition-colors [color-scheme:dark]">
            <option value="low" class="bg-[#121214]">Low Priority</option>
            <option value="medium" class="bg-[#121214]" selected>Medium Priority</option>
            <option value="high" class="bg-[#121214]">High Priority</option>
          </select>

          <div class="w-px h-4 bg-white/10"></div> <input type="date" id="dueDateInput"
            class="bg-transparent text-xs font-medium text-zinc-400 hover:text-zinc-200 px-2 py-1.5 outline-none cursor-pointer transition-colors [color-scheme:dark]">

          <div class="w-px h-4 bg-white/10"></div> <button id="toggleCompletedBtn"
            class="text-xs font-medium text-zinc-400 hover:text-zinc-200 px-2 py-1.5 outline-none cursor-pointer flex items-center gap-1.5 transition-colors">
            <i class="ph-bold ph-eye-slash text-[14px]"></i>
            <span>Hide Done</span>
          </button>
        </div>

        <div class="flex items-center gap-3">
          <span id="status" class="text-[11px] font-medium text-zinc-500"></span>
          <button id="saveBtn"
            class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-lg text-xs font-semibold transition-all active:scale-95 flex items-center gap-1.5 shadow-sm">
            <i class="ph-bold ph-arrow-up"></i> Capture
          </button>
        </div>
      </div>
    </section>

    <section class="flex-1 overflow-hidden flex flex-col min-h-0">
      <ul id="taskList" class="flex-1 overflow-y-auto space-y-4 pb-10 custom-scrollbar pr-2 pt-2"></ul>
    </section>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
