<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Linking to a local CSS file instead of a CDN -->
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <!-- Header -->
  <header>
    <div class="logo-box">
      <!-- Inline Target SVG -->
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 256 256">
        <path d="M224,128a96,96,0,1,1-96-96A96,96,0,0,1,224,128Z" opacity="0.2"></path>
        <path
          d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm40-88a40,40,0,1,1-40-40A40,40,0,0,1,168,128Zm-16,0a24,24,0,1,1-24-24A24,24,0,0,1,152,128Z">
        </path>
      </svg>
    </div>
    <div class="header-text">
      <h1>Task Capture</h1>
      <p>Browser Extension</p>
    </div>
  </header>

  <!-- LOGIN VIEW -->
  <div id="loginView" class="flex flex-col gap-3 hidden">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn" class="btn-primary">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 256 256">
        <path
          d="M141.66,133.66l-40,40a8,8,0,0,1-11.32-11.32L116.69,136H24a8,8,0,0,1,0-16H116.69L90.34,93.66a8,8,0,0,1,11.32-11.32l40,40A8,8,0,0,1,141.66,133.66ZM200,32H136a8,8,0,0,0,0,16h56V208H136a8,8,0,0,0,0,16h64a16,16,0,0,0,16-16V48A16,16,0,0,0,200,32Z">
        </path>
      </svg>
      Connect Account
    </button>
  </div>

  <!-- LOGGED IN VIEW -->
  <div id="loggedInView" class="flex flex-col items-center hidden">
    <div class="success-icon">
      <svg width="24" height="24" fill="currentColor" viewBox="0 0 256 256">
        <path
          d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z">
        </path>
      </svg>
    </div>
    <p class="status-text">Extension is Active</p>
    <p id="userEmailDisplay" class="user-email"></p>

    <button id="logoutBtn" class="btn-secondary">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 256 256">
        <path
          d="M120,216a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V40a8,8,0,0,1,8-8h64a8,8,0,0,1,0,16H56V208h56A8,8,0,0,1,120,216Zm109.66-93.66-40-40a8,8,0,0,0-11.32,11.32L204.69,120H104a8,8,0,0,0,0,16H204.69l-26.35,26.34a8,8,0,0,0,11.32,11.32l40-40A8,8,0,0,0,229.66,122.34Z">
        </path>
      </svg>
      Disconnect
    </button>
  </div>

  <!-- Status Message -->
  <p id="status"></p>

  <script src="popup.js"></script>
</body>

</html>
