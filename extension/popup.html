<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        width: 240px;
        padding: 14px;
        background: #0f1115;
        color: #e8e9ec;
      }
      h3 {
        margin: 0 0 10px;
      }
      input {
        width: 100%;
        margin-bottom: 8px;
        padding: 7px;
        box-sizing: border-box;
        background: #23272f;
        border: 1px solid #2c313a;
        color: #e8e9ec;
        border-radius: 6px;
      }
      button {
        width: 100%;
        padding: 7px;
        background: #4f7cff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .hint {
        font-size: 11px;
        color: #9aa0ab;
        margin-top: 8px;
      }
      .error {
        color: #ff5f5f;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="popup-root"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
